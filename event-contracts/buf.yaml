# buf configuration

version: v2

modules:
  # local schema files path. This is also set as root when `buf push`
  - path: proto
  # remote identifier for `buf push`
    name: buf.build/byteparadise/quickbite-event-contracts

lint:
  use:
    # default recommended linting rule
    - STANDARD

breaking:
  use:
    # enables CI to catch violations (type, numbering, etc) over schema structure
    - FILE
