name: order-service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'order-service/**'
  push:
    branches: [main]
    paths:
      - 'order-service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: bufbuild/buf-setup-action@v1
      - name: Generate code from event contracts
        run: buf generate
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      - name: Build
        run: go build ./...