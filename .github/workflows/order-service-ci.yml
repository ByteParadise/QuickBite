name: order-service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'order-service/**'
      - '.github/workflows/order-service-ci.yml'
  push:
    branches: [main, 'sprint*/main']
    paths:
      - 'order-service/**'
      - '.github/workflows/order-service-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: order-service/go.sum
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate code from event contracts
        run: buf generate
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      - name: Build
        run: go build ./...