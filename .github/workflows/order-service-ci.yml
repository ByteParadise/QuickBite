name: order-service

on:
  pull_request:
    paths:
      - 'order-service/**'
  push:
    branches: [main]
    paths:
      - 'order-service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build
        run: go build ./...