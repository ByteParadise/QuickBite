name: restaurant-service

on:
  pull_request:
    paths:
      - 'restaurant-service/**'
  push:
    branches: [main]
    paths:
      - 'restaurant-service/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: restaurant-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check