name: restaurant-service

on:
  # adds a menaul "run workflow" trigger
  workflow_dispatch:
  pull_request:
    paths:
      - 'restaurant-service/**'
      - '.github/workflows/restaurant-service-ci.yml'
  push:
    branches: [main, 'sprint*/main']
    paths:
      - 'restaurant-service/**'
      - '.github/workflows/restaurant-service-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: restaurant-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate code from event contracts
        run: buf generate
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      - name: Type check
        run: npx tsc --noEmit