name: buf

on:
  pull_request:
    paths:
      - 'event-contracts/**'
  push:
    branches: [main]
    paths:
      - 'event-contracts/**'

jobs:
  buf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint
        run: buf lint
      - name: Breaking changes against main
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=main,subdir=event-contracts"