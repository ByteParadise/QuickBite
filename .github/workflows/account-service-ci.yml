name: account-service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'account-service/**'
      - '.github/workflows/account-service-ci.yml'
  push:
    branches: [main, 'sprint*/main']
    paths:
      - 'account-service/**'
      - '.github/workflows/account-service-ci.yml'

permissions:
  contents: read
  # required for github actions to even request an OIDC token at all.
  # without it, configure-aws-credentials has nothing to exchange with AWS
  id-token: write

jobs:
  # ? job names are not predefined 
  # checks on merge
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate code from event contracts
        run: buf generate
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

  # after merge, or a manual re-run (e.g. retrying a failed deploy without a new commit)
  build-and-push:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        # build and push image tagged with above env values
        run: |
          docker build -t "$REGISTRY/quickbite/account-service:$IMAGE_TAG" .
          docker push "$REGISTRY/quickbite/account-service:$IMAGE_TAG"

      # install standalone kustomize CLI
      # needed because `kustomize edit set image` is a CLI subcommand that doesn't exist via `kubectl kustomize`
      - uses: imranismail/setup-kustomize@v2

      - name: Generate GitOps commit token
        id: gitops-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ByteParadise
          repositories: QuickBite-gitops

      - name: Update image tag in QuickBite-gitops
        working-directory: .
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITOPS_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/ByteParadise/QuickBite-gitops.git" gitops-repo
          cd gitops-repo/apps/account-service/overlays/session

          kustomize edit set image \
            555044956548.dkr.ecr.us-east-1.amazonaws.com/quickbite/account-service="555044956548.dkr.ecr.us-east-1.amazonaws.com/quickbite/account-service:${IMAGE_TAG}"

          git config user.name "quickbite-gitops-bot[bot]"
          git config user.email "quickbite-gitops-bot[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "Update account-service image to ${IMAGE_TAG}"
          git push origin main
