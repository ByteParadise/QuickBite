name: account-service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'account-service/**'
  push:
    branches: [main]
    paths:
      - 'account-service/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - uses: bufbuild/buf-setup-action@v1
      - name: Generate code from event contracts
        run: buf generate
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check