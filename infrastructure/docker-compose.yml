services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: quickbite
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"